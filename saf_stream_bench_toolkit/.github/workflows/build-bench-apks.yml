name: Build bench APKs and publish release

# Assumes this repo's root contains (as produced by the bench toolkit):
#   saf_stream-main.zip
#   saf_stream-main-jni.zip
#   build_bench_apks.sh
#   bench_assets/benchmark_page.dart
#   bench_assets/bench_main.dart
#
# Triggers:
#   - push of a tag like v1.2.3  -> builds + creates/updates that release
#   - manual dispatch            -> builds + creates/updates a "latest" release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to attach the built APKs to"
        required: false
        default: "bench-latest"

permissions:
  contents: write # needed to create/update releases and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bench_build/**/example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Verify expected inputs are present
        run: |
          test -f saf_stream-main.zip || { echo "Missing saf_stream-main.zip"; exit 1; }
          test -f saf_stream-main-jni.zip || { echo "Missing saf_stream-main-jni.zip"; exit 1; }
          test -f build_bench_apks.sh || { echo "Missing build_bench_apks.sh"; exit 1; }
          test -f bench_assets/benchmark_page.dart || { echo "Missing bench_assets/benchmark_page.dart"; exit 1; }
          test -f bench_assets/bench_main.dart || { echo "Missing bench_assets/bench_main.dart"; exit 1; }

      - name: Build both APKs
        run: |
          chmod +x build_bench_apks.sh
          ./build_bench_apks.sh

      - name: Rename APKs with version info
        id: apks
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          orig_name="saf_stream_bench_orig-${short_sha}.apk"
          jni_name="saf_stream_bench_jni-${short_sha}.apk"
          cp bench_build/saf_stream_bench_orig.apk "bench_build/${orig_name}"
          cp bench_build/saf_stream_bench_jni.apk "bench_build/${jni_name}"
          echo "orig_path=bench_build/${orig_name}" >> "$GITHUB_OUTPUT"
          echo "jni_path=bench_build/${jni_name}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts (always, even without a release)
        uses: actions/upload-artifact@v4
        with:
          name: bench-apks
          path: |
            ${{ steps.apks.outputs.orig_path }}
            ${{ steps.apks.outputs.jni_path }}
          retention-days: 14

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release with both APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Bench build ${{ steps.tag.outputs.tag }}"
          body: |
            Automated benchmark build comparing `saf_stream` before/after the JNI hot-path change.

            - `saf_stream_bench_orig-*.apk` — original MethodChannel/EventChannel implementation
            - `saf_stream_bench_jni-*.apk` — JNI-based hot path

            Install both side by side and run the in-app benchmark suite on each.
          files: |
            ${{ steps.apks.outputs.orig_path }}
            ${{ steps.apks.outputs.jni_path }}
          # For workflow_dispatch runs this re-uses/updates the same
          # "bench-latest" release each time instead of creating a new one.
          fail_on_unmatched_files: true
